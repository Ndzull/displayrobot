<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Robot Face</title>
    <style>
        body {
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            color: #555; 
        }

        svg {
            width: 80%;
            height: auto;
            max-height: 80vh;
        }

        .eye {
            fill: white;
            transform-origin: center;
            animation: blink 3s infinite;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .animated-eyebrows {
            fill: none;
            stroke: white;
            stroke-width: 15;
            stroke-linecap: round;
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
            opacity: 0;
            transform: translateY(-50px);
        }

        .show-brows {
            opacity: 1;
            transform: translateY(0);
        }

        .tear {
            fill: #89CFF0;
            opacity: 0;
        }

        .show-tear {
            animation: drop 2s infinite;
        }

        @keyframes drop {
            0% {
                opacity: 1;
                transform: translateY(-80px);
            }
            100% {
                opacity: 0;
                transform: translateY(120px);
            }
        }
        .show-tear-static {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        @keyframes blink {
            0%, 93% { transform: scaleY(1); }
            95% { transform: scaleY(0.05); }
            97% { transform: scaleY(1); }
            100% { transform: scaleY(1); }
        }

        .animated-path {
            transition: d 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .hints {
            position: absolute;
            bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        kbd {
            background: #333;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .anger-mark {
            fill: none;
            stroke: #E53935; 
            stroke-width: 14;
            stroke-linecap: round;
            opacity: 0;
            transform-origin: 930px 200px;
            transform: scale(0.5) rotate(-15deg);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .show-anger {
            opacity: 1 !important;
            transform: scale(1) rotate(0deg) !important;
        }

        .hide-normal {
            opacity: 0 !important;
            transition: opacity 0.3s ease-out;
        }

        .dizzy-eyes {
            opacity: 0;
            transition: opacity 0.3s ease-out;
            pointer-events: none;
        }

        .show-dizzy {
            opacity: 1 !important;
        }

        .spiral {
            transform-origin: 0px 0px; 
            animation: spin-cw 1.5s linear infinite; 
        }

        @keyframes spin-cw {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .sleepy-hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .show-sleepy {
            opacity: 1 !important;
        }

        .snot-bubble {
            transform-origin: 510px 450px;
            animation: snore-bubble 3.5s ease-in-out infinite;
        }

        @keyframes snore-bubble {
            0%, 100% { transform: scale(0.3); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        .zzz-text {
            opacity: 0;
            /* move diagonally from left toward upper-right, with a slight slant */
            animation: float-zzz 3.5s linear infinite;
            transform-origin: center;
            fill: rgb(155, 89, 182);
        }

        .zzz-1 { animation-delay: 0s; }
        .zzz-2 { animation-delay: 1s; }
        .zzz-3 { animation-delay: 2s; }

        @keyframes float-zzz {
            0% { transform: translate(-60px, 0) rotate(-20deg) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(120px, -140px) rotate(-20deg) scale(1.3); opacity: 0; }
        }

        .amazed-hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .show-amazed { opacity: 1 !important; }
        .star {
            animation: pulse-star 1s ease-in-out infinite alternate;
        }
        @keyframes pulse-star {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }

        .thinking-hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .show-thinking {
            opacity: 1 !important;
        }

        .dot-text {
            opacity: 0;
            animation: think-dot 2s infinite;
            fill: white; 
        }

        .dot-1 { animation-delay: 0s; }
        .dot-2 { animation-delay: 0.4s; }
        .dot-3 { animation-delay: 0.8ss; }

        @keyframes think-dot {
            0% { opacity: 0; transform: translateY(10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .salting-hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .show-salting {
            opacity: 1 !important;
        }

        .blush {
            fill: #FFB6C1; 
            filter: blur(15px); 
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <!-- Canvas Muka Robot -->
    <svg viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">
        <!-- Alis -->
        <path id="eyebrow-left" class="animated-eyebrows" d="M 150 180 Q 250 160, 350 210" />
        <path id="eyebrow-right" class="animated-eyebrows" d="M 730 210 Q 830 160, 930 180" />
        <!-- Mata -->
        <ellipse id="eye-right" class="eye" cx="250" cy="300" rx="100" ry="150" />
        <ellipse id="eye-left" class="eye" cx="830" cy="300" rx="100" ry="150" />

        <!-- air mata -->
        <g id="tear-left" class="tear">
            <ellipse cx="240" cy="470" rx="22" ry="14" />
            <path d="M 218 470 Q 240 510, 262 470" fill="#89CFF0" />
        </g>

        <g id="tear-right" class="tear">
            <ellipse cx="820" cy="470" rx="22" ry="14" />
            <path d="M 798 470 Q 820 510, 842 470" fill="#89CFF0" />
        </g>

        <!-- anger mark -->
        <g id="anger-mark" class="anger-mark">
            <path d="M 900 150 Q 930 180, 960 150" /> 
            <path d="M 900 250 Q 930 220, 960 250" /> 
            <path d="M 880 170 Q 910 200, 880 230" /> 
            <path d="M 980 170 Q 950 200, 980 230" /> 
        </g>

        <!-- salting -->
        <g id="salting-effects" class="salting-hidden">
            <!-- Blush Pipi Kiri -->
            <ellipse cx="180" cy="480" rx="70" ry="35" class="blush" />
            <!-- Blush Pipi Kanan -->
            <ellipse cx="900" cy="480" rx="70" ry="35" class="blush" />
            
            <!-- Mata Kiri Melengkung (Senang) -->
            <path d="M 180 320 Q 250 220, 320 320" fill="none" stroke="white" stroke-width="25" stroke-linecap="round" />
            <!-- Mata Kanan Melengkung (Senang) -->
            <path d="M 760 320 Q 830 220, 900 320" fill="none" stroke="white" stroke-width="25" stroke-linecap="round" />
        </g>

        <!-- berpikir-->
        <g id="thinking-effects" class="thinking-hidden">
            <text x="840" y="100" class="dot-text dot-1" font-size="90" font-family="sans-serif" font-weight="bold">.</text>
            <text x="900" y="100" class="dot-text dot-2" font-size="90" font-family="sans-serif" font-weight="bold">.</text>
            <text x="960" y="100" class="dot-text dot-3" font-size="90" font-family="sans-serif" font-weight="bold">.</text>
        </g>

        <!-- pusing -->
         <g id="dizzy-eye-left" class="dizzy-eyes" transform="translate(250, 300)">
            <path class="spiral" d="M 0 0 A 15 15 0 0 1 30 0 A 30 30 0 0 1 -30 0 A 45 45 0 0 1 60 0 A 60 60 0 0 1 -60 0 A 75 75 0 0 1 90 0 A 90 90 0 0 1 -90 0 A 105 105 0 0 1 120 0 A 120 120 0 0 1 -120 0" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" />
        </g>
        <g id="dizzy-eye-right" class="dizzy-eyes" transform="translate(830, 300)">
            <path class="spiral" d="M 0 0 A 15 15 0 0 1 30 0 A 30 30 0 0 1 -30 0 A 45 45 0 0 1 60 0 A 60 60 0 0 1 -60 0 A 75 75 0 0 1 90 0 A 90 90 0 0 1 -90 0 A 105 105 0 0 1 120 0 A 120 120 0 0 1 -120 0" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" />
        </g>
        
        <!-- Mulut (Default: Senyum) -->
        <path id="mouth" class="animated-path" 
              d="M 450 500 C 500 560, 580 560, 630 500" 
              stroke="white" stroke-width="15" fill="none" stroke-linecap="round"/>

        <!-- ngantuk -->
        <g id="sleepy-effects" class="sleepy-hidden">
            <circle cx="530" cy="450" r="40" class="snot-bubble" fill="#89CFF0" stroke="white" stroke-width="3" />
            <text x="650" y="320" class="zzz-text zzz-1" fill="white" font-size="50" font-family="Comic Sans MS, sans-serif" font-weight="bold">Z</text>
            <text x="710" y="250" class="zzz-text zzz-2" fill="white" font-size="70" font-family="Comic Sans MS, sans-serif" font-weight="bold">Z</text>
            <text x="780" y="160" class="zzz-text zzz-3" fill="white" font-size="90" font-family="Comic Sans MS, sans-serif" font-weight="bold">Z</text>
        </g>

        <!-- kagum -->
         <g id="amazed-effects" class="amazed-hidden">
            <path class="star" d="M 250 160 Q 250 300 340 300 Q 250 300 250 440 Q 250 300 160 300 Q 250 300 250 160 Z" fill="#FCE86C" stroke="black" stroke-width="5" transform-origin="250px 300px"/>
            <path class="star" d="M 830 160 Q 830 300 920 300 Q 830 300 830 440 Q 830 300 740 300 Q 830 300 830 160 Z" fill="#FCE86C" stroke="black" stroke-width="5" transform-origin="830px 300px"/>
            <ellipse cx="540" cy="570" rx="90" ry="60" fill="url(#mouthGrad)" />
        </g>
    </svg>

    <!-- keyboard shortcut -->
    <div class="hints">
        <!-- Klik <kbd>1</kbd> Senyum | <kbd>2</kbd> Therock | <kbd>3</kbd> Datar | <kbd>4</kbd> Marah | <kbd>5</kbd> Sedih | <kbd>6</kbd> Pusing | <kbd>7</kbd> Bersemi | <kbd>8</kbd> Berpikir | <kbd>9</kbd> Ngantuk | <kbd>0</kbd> Kagum -->
    </div>

<script>
const mouth = document.getElementById('mouth');
const eyeLeft = document.getElementById('eye-left');
const eyeRight = document.getElementById('eye-right');
const browLeft = document.getElementById('eyebrow-left');
const browRight = document.getElementById('eyebrow-right');
const tearLeft  = document.getElementById('tear-left');
const tearRight = document.getElementById('tear-right');
const angerMark = document.getElementById('anger-mark');
const thinkingEffects = document.getElementById('thinking-effects');
const sleepyEffects = document.getElementById('sleepy-effects');
const amazedEffects = document.getElementById('amazed-effects');
const saltingEffects = document.getElementById('salting-effects');

// ekspresi setting
const expressions = {
    smile: {
        eyebrows: false,
        tears: false,
        anger: false,
        isDizzy: false,
        mouth: "M 450 500 C 500 560, 580 560, 630 500",
        eyeL: { cx: 250, cy: 300, rx: 100, ry: 150 }, 
        eyeR: { cx: 830, cy: 300, rx: 100, ry: 150 }
    },
    
    therock: {
        eyebrows: true,
        tears: false,
        anger: false,
        isDizzy: false,
        browLeft: "M 150 140 Q 250 210, 350 170",
        browRight: "M 730 160 Q 830 100, 930 140",
        mouth: "M 400 530 C 450 500, 400 500, 510 590",
        eyeL: { cx: 250, cy: 300, rx: 100, ry: 150 }, 
        eyeR: { cx: 830, cy: 300, rx: 70, ry: 100 }  
    },

    angry: {
        eyebrows: true,
        tears: false,
        anger: true,
        isDizzy: false,
        mouth: "M 450 500 C 500 440, 580 440, 630 500",
        browLeft: "M 150 100 Q 250 150, 350 180", 
        browRight: "M 930 100 Q 830 150, 730 180", 
        eyeL: { cx: 250, cy: 320, rx: 100, ry: 120 }, 
        eyeR: { cx: 830, cy: 320, rx: 100, ry: 120 }
    },

    sad: {
        eyebrows: true,
        tears: true,
        anger: false,
        isDizzy: false,
        mouth: "M 450 500 C 500 440, 580 440, 630 500",
        browLeft: "M 150 180 Q 250 150, 350 100", 
        browRight: "M 930 180 Q 830 150, 730 100", 
        eyeL: { cx: 250, cy: 320, rx: 100, ry: 120 }, 
        eyeR: { cx: 830, cy: 320, rx: 100, ry: 120 }

    },

    thinking:{
        isThinking: true,
        isDizzy: false, isSleepy: false, isAmazed: false,
        eyebrows: false, tears: false, anger: false,
        mouth: "M 450 460 C 410 510, 440 500, 470 480",
        eyeL: { cx: 220, cy: 270, rx: 100, ry: 150 }, 
        eyeR: { cx: 800, cy: 270, rx: 100, ry: 150 }
    },
    
    neutral: {
        eyebrows: false,
        tears: false,
        isDizzy: false,
        mouth: "M 450 500 C 500 500, 580 500, 630 500",
        eyeL: { cx: 250, cy: 300, rx: 100, ry: 150 }, 
        eyeR: { cx: 830, cy: 300, rx: 100, ry: 150 }
    },

    dizzy: {
        isDizzy: true, 
        eyebrows: false,
        tears: false,
        mouth: "M 520 540 Q 540 520, 560 540", 
        eyeL: { cx: 250, cy: 300, rx: 100, ry: 150 }, 
        eyeR: { cx: 830, cy: 300, rx: 100, ry: 150 }
    },

    charged: {
        isDizzy: false, 
        eyebrows: true,
        tears: false,
        anger: false,
        browLeft: "M 150 140 Q 250 210, 350 170",
        browRight: "M 730 160 Q 830 100, 930 140",
        mouth: "M 450 500 C 500 560, 580 560, 630 500",
        eyeL: { cx: 250, cy: 300, rx: 100, ry: 150 }, 
        eyeR: { cx: 830, cy: 300, rx: 100, ry: 150 }
    },

    sleepy: {
        isSleepy: true, 
        isDizzy: false,
        eyebrows: false,
        tears: false,
        anger: false,
        mouth: "M 510 530 C 510 480, 570 480, 570 530 C 570 580, 510 580, 510 530", 
        eyeL: { cx: 250, cy: 300, rx: 100, ry: 5 }, 
        eyeR: { cx: 830, cy: 300, rx: 100, ry: 5 }
    },

    salting: {
        isSalting: true, isThinking: false, isDizzy: false, isSleepy: false, isAmazed: false,
        eyebrows: false, tears: false, anger: false,
        // Mulut senyum lebar
        mouth: "M 420 480 C 480 560, 600 560, 660 480",
        // Mata normal disetel default (tidak akan terlihat karena disembunyikan)
        eyeL: { cx: 250, cy: 300, rx: 100, ry: 150 }, 
        eyeR: { cx: 830, cy: 300, rx: 100, ry: 150 }
    },

    amazed: {
        isAmazed: true, 
        isSleepy: false, 
        isDizzy: false,
        eyebrows: false, 
        tears: false, 
        anger: false,
        mouth: "M 510 530 C 510 480, 570 480, 570 530 C 570 580, 510 580, 510 530", 
        eyeL: { cx: 250, cy: 300, rx: 100, ry: 150 },
        eyeR: { cx: 830, cy: 300, rx: 100, ry: 150 }
    }


};

function setExpression(mood) {
    const data = expressions[mood];

    if (data.isDizzy === true) {
        eyeLeft.classList.add('hide-normal');
        eyeRight.classList.add('hide-normal');
        document.getElementById('dizzy-eye-left').classList.add('show-dizzy');
        document.getElementById('dizzy-eye-right').classList.add('show-dizzy');
    } else {
        eyeLeft.classList.remove('hide-normal');
        eyeRight.classList.remove('hide-normal');
        document.getElementById('dizzy-eye-left').classList.remove('show-dizzy');
        document.getElementById('dizzy-eye-right').classList.remove('show-dizzy');
    }

    if (typeof thinkingEffects !== 'undefined') thinkingEffects.classList.remove('show-thinking');
    if (data.isThinking === true) {
        thinkingEffects.classList.add('show-thinking');
    } else {
        thinkingEffects.classList.remove('show-thinking');
    }

    if (typeof sleepyEffects !== 'undefined') sleepyEffects.classList.remove('show-sleepy');
    if (data.isSleepy === true) {
        sleepyEffects.classList.add('show-sleepy');
    } else {
        sleepyEffects.classList.remove('show-sleepy');
    }

    if (typeof amazedEffects !== 'undefined') amazedEffects.classList.remove('show-amazed');
    if (data.isAmazed === true) {
        amazedEffects.classList.add('show-amazed');
    } else {
        amazedEffects.classList.remove('show-amazed');
    }

    if (typeof saltingEffects !== 'undefined') saltingEffects.classList.remove('show-salting');
    if (data.isSalting === true) {
        saltingEffects.classList.add('show-salting');
    } else {
        saltingEffects.classList.remove('show-salting');
    }
    
    if (data) {
        mouth.setAttribute('d', data.mouth);
        
        eyeLeft.setAttribute('rx', data.eyeL.rx);
        eyeLeft.setAttribute('ry', data.eyeL.ry);
        eyeLeft.setAttribute('cy', data.eyeL.cy);
        
        eyeRight.setAttribute('rx', data.eyeR.rx);
        eyeRight.setAttribute('ry', data.eyeR.ry);
        eyeRight.setAttribute('cy', data.eyeR.cy);
    }

    if (data.eyebrows === true) {
                    browLeft.classList.add('show-brows');
                    requestAnimationFrame(() => {
                        browLeft.setAttribute('d', data.browLeft);
                    });
                    browRight.classList.add('show-brows');
                    requestAnimationFrame(() => {
                        browRight.setAttribute('d', data.browRight);
                    });
                } else {
                    browLeft.classList.remove('show-brows');
                    browRight.classList.remove('show-brows');
                }

    if (data.tears === true) {
        tearLeft.classList.add('show-tear');
        tearRight.classList.add('show-tear');
    } else {
        tearLeft.classList.remove('show-tear');
        tearRight.classList.remove('show-tear');  
    } 
    
    if (data.anger === true) {
        angerMark.classList.add('show-anger');
    } else {
        angerMark.classList.remove('show-anger');
    } 
}


// Listener keyboard
document.addEventListener('keydown', (event) => {
    switch(event.key) {
        case '1':
            setExpression('smile');
            console.log("Ekspresi: Senyum");
            break;
        case '2':
            setExpression('therock');
            console.log("Ekspresi: therock");
            break;
        case '3':
            setExpression('neutral');
            console.log("Ekspresi: Datar");
            break;
        case '4':
            setExpression('angry');
            console.log("Ekspresi: Marah");
            break;
        case '5':
            setExpression('sad');
            console.log("Ekspresi: Sedih");
            break;
        case '6':
            setExpression('dizzy');
            console.log("Ekspresi: Pusing");
            break;
        case '7':
            setExpression('salting');
            console.log("Ekspresi: Bersemi");
            break;
        case '8':
            setExpression('thinking');
            console.log("Ekspresi: Berpikir");
            break;
        case '9':
            setExpression('sleepy');
            console.log("Ekspresi: Ngantuk");
            break;
        case '0':
            setExpression('amazed');
            console.log("Ekspresi: Kagum");
            break;
    }
});
    </script>
</body>
</html>
